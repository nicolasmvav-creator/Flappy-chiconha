<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Flappy Chiconha</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 10%, rgba(126, 255, 164, 0.18), transparent 32%),
        linear-gradient(180deg, #071a0e 0%, #0d2414 62%, #061008 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #wrap {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 14px;
    }

    canvas {
      width: min(100vw - 28px, calc((100vh - 28px) * 16 / 9));
      height: min(100vh - 28px, calc((100vw - 28px) * 9 / 16));
      max-width: 1280px;
      max-height: 720px;
      border-radius: 28px;
      box-shadow:
        0 28px 80px rgba(0, 0, 0, 0.45),
        0 0 0 1px rgba(210, 255, 209, 0.18),
        inset 0 0 80px rgba(62, 175, 76, 0.1);
      background: #102817;
      touch-action: none;
      outline: none;
    }

    #badge {
      position: fixed;
      left: 18px;
      bottom: 14px;
      padding: 8px 12px;
      border: 1px solid rgba(216, 255, 205, 0.18);
      border-radius: 999px;
      background: rgba(3, 17, 8, 0.5);
      color: rgba(236, 255, 229, 0.72);
      font-size: 13px;
      letter-spacing: 0.01em;
      backdrop-filter: blur(10px);
      user-select: none;
      pointer-events: none;
    }

    @media (max-width: 700px) {
      #badge {
        display: none;
      }

      canvas {
        border-radius: 18px;
      }

      #wrap {
        padding: 8px;
      }
    }
  </style>
</head>

  <div id="badge">Espaço para voar · R para reiniciar</div>

      function roundRectPath(context, x, y, w, h, r) {
        const radius = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
        context.beginPath();
        context.moveTo(x + radius, y);
        context.lineTo(x + w - radius, y);
        context.quadraticCurveTo(x + w, y, x + w, y + radius);
        context.lineTo(x + w, y + h - radius);
        context.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
        context.lineTo(x + radius, y + h);
        context.quadraticCurveTo(x, y + h, x, y + h - radius);
        context.lineTo(x, y + radius);
        context.quadraticCurveTo(x, y, x + radius, y);
        context.closePath();
      }

      function drawLeaf(x, y, size, angle, fill, alpha = 1, vein = true) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.globalAlpha *= alpha;
        const grad = ctx.createLinearGradient(0, -size, 0, size);
        grad.addColorStop(0, fill);
        grad.addColorStop(1, "#0d5f28");

        ctx.beginPath();
        ctx.moveTo(0, -size);
        ctx.bezierCurveTo(size * 0.85, -size * 0.72, size * 0.94, size * 0.42, 0, size);
        ctx.bezierCurveTo(-size * 0.94, size * 0.42, -size * 0.85, -size * 0.72, 0, -size);
        ctx.fillStyle = grad;
        ctx.fill();

        if (vein) {
          ctx.strokeStyle = "rgba(226, 255, 201, 0.36)";
          ctx.lineWidth = Math.max(1, size * 0.08);
          ctx.beginPath();
          ctx.moveTo(0, -size * 0.72);
          ctx.lineTo(0, size * 0.68);
          ctx.stroke();

          ctx.lineWidth = Math.max(0.7, size * 0.045);
          for (let i = -2; i <= 2; i += 1) {
            if (i === 0) continue;
            const yy = i * size * 0.18;
            ctx.beginPath();
            ctx.moveTo(0, yy);
            ctx.lineTo((i > 0 ? 1 : -1) * size * 0.42, yy + size * 0.2);
            ctx.stroke();
          }
        }
        ctx.restore();

        sky.addColorStop(1, "#082012");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, H);

        const glow = ctx.createRadialGradient(720, 80, 0, 720, 80, 250);
        glow.addColorStop(0, "rgba(198, 255, 153, 0.34)");
        glow.addColorStop(0.32, "rgba(119, 232, 100, 0.14)");
        glow.addColorStop(1, "rgba(119, 232, 100, 0)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, W, H);

        ctx.save();
        ctx.globalAlpha = 0.52;
        for (const bug of fireflies) {
          const x = (bug.x + Math.sin(frame * 0.012 + bug.phase) * 18 + frame * bug.drift * 0.08) % W;
          const y = bug.y + Math.cos(frame * 0.01 + bug.phase) * 10;
          const pulse = 0.35 + Math.sin(frame * 0.05 + bug.phase) * 0.25;
          ctx.fillStyle = `rgba(228, 255, 162, ${0.18 + pulse})`;
          ctx.beginPath();
          ctx.arc(x, y, bug.radius, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        ctx.save();
        for (const leaf of backgroundLeaves) {
          const drift = frame * leaf.layer * 0.35;
          const x = (leaf.x - drift + W + 80) % (W + 80) - 40;
          const y = leaf.y + Math.sin(frame * 0.02 + leaf.wobble) * 7 * leaf.layer;
          drawLeaf(
            x,
            y,
            leaf.size,
            leaf.angle + Math.sin(frame * 0.008 + leaf.wobble) * 0.35,
            leaf.layer > 0.65 ? "#46bb58" : "#2f8f42",
            0.12 + leaf.layer * 0.22,
            false
          );
        }
        ctx.restore();

        drawDistantHill(378, "#0d401f", 0.54, 1.15);
        drawDistantHill(420, "#0a3219", 0.72, 0.84);
      }

      function drawDistantHill(baseY, color, alpha, scale) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, H);
        ctx.lineTo(0, baseY);
        for (let x = 0; x <= W + 40; x += 40) {
          const y = baseY - Math.sin((x + frame * 0.22) * 0.011 * scale) * 22 - Math.cos(x * 0.025) * 11;
          ctx.lineTo(x, y);
        }
        ctx.lineTo(W, H);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawGround() {
        const soil = ctx.createLinearGradient(0, groundY, 0, H);
        soil.addColorStop(0, "#224b1f");
        soil.addColorStop(0.36, "#183715");
        soil.addColorStop(1, "#0b1c0a");
        ctx.fillStyle = soil;
        ctx.fillRect(0, groundY, W, groundH);

        ctx.fillStyle = "rgba(218, 255, 188, 0.22)";
        ctx.fillRect(0, groundY, W, 3);

        ctx.save();
        ctx.beginPath();
        ctx.rect(0, groundY - 30, W, 55);
        ctx.clip();

        for (let x = -40; x < W + 40; x += 14) {
          const phase = (x * 0.37 + frame * 0.05);
          const h = 25 + Math.sin(phase) * 11 + (x % 5) * 2;
          const sway = Math.sin(frame * 0.04 + x) * 5;
          ctx.strokeStyle = x % 4 === 0 ? "#67d458" : "#3eaa42";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(x, groundY + 18);
          ctx.quadraticCurveTo(x + sway, groundY - h * 0.55, x + sway * 0.55, groundY - h);
          ctx.stroke();

          if (x % 3 === 0) {
            drawLeaf(x + sway * 0.42, groundY - h + 4, 8, -0.5 + Math.sin(phase) * 0.5, "#5fcc57", 0.82, false);
          }
        }
        ctx.restore();

        ctx.save();
        ctx.globalAlpha = 0.28;
        ctx.fillStyle = "#031009";
        for (let x = 0; x < W; x += 34) {
          ctx.beginPath();
          ctx.ellipse(x + ((frame * 0.9) % 34), groundY + 44 + Math.sin(x) * 8, 9, 3, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function resetRound() {
        state = "ready";
        score = 0;
        spawnTimer = 40;
        speed = 3.42;
        shake = 0;
        flash = 0;
        lastRecord = false;
        gapCenter = 250;
        bird.x = 212;
        bird.y = 260;
        bird.vy = 0;
        bird.rotation = 0;
        bird.wing = 0;
        obstacles.length = 0;
        particles.length = 0;
      }

      function startOrFlap() {
        if (state === "gameover") {
          resetRound();
          state = "playing";
          bird.vy = -8.75;
          bird.wing = 1;
          burstLeaves();
          return;
        }

        if (state === "ready") {
          state = "playing";
          spawnTimer = 12;
        }

        if (state === "playing") {
          bird.vy = -8.75;
          bird.wing = 1;
          burstLeaves();
        }
      }

      function gameOver() {
        if (state !== "playing") return;
        state = "gameover";
        shake = 18;
        flash = 1;
        lastRecord = score > best;
        if (lastRecord) {
          best = score;
          try {
            localStorage.setItem(storageKey, String(best));
          } catch (err) {}
        }

        for (let i = 0; i < 28; i += 1) {
          particles.push({
            x: bird.x + (Math.random() - 0.5) * 32,
            y: bird.y + (Math.random() - 0.5) * 32,
            vx: (Math.random() - 0.5) * 7,
            vy: -2 - Math.random() * 5,
            g: 0.16 + Math.random() * 0.1,
            life: 36 + Math.random() * 22,
            maxLife: 58,
            size: 5 + Math.random() * 9,
            spin: (Math.random() - 0.5) * 0.34,
            angle: Math.random() * Math.PI * 2
          });
        }
      }

      function spawnObstacle() {
        const gap = clamp(178 - Math.min(score, 18) * 2.2, 138, 178);
        const min = 92 + gap / 2;
        const max = groundY - 92 - gap / 2;
        const target = gapCenter + (Math.random() * 170 - 85);
        gapCenter = clamp(lerp(target, min + Math.random() * (max - min), 0.3), min, max);

        obstacles.push({
          x: W + 35,
          w: 88,
          gap,
          top: gapCenter - gap / 2,
          bottom: gapCenter + gap / 2,
          scored: false,
          seed: Math.random() * Math.PI * 2
        });
      }

      function burstLeaves() {
        for (let i = 0; i < 10; i += 1) {
          particles.push({
            x: bird.x - 25,
            y: bird.y + 6,
            vx: -2.5 - Math.random() * 3.5,
            vy: -1.8 + Math.random() * 3.6,
            g: 0.045,
            life: 26 + Math.random() * 20,
            maxLife: 46,
            size: 5 + Math.random() * 7,
            spin: (Math.random() - 0.5) * 0.28,
            angle: Math.random() * Math.PI * 2
          });
        }
      }

      function update(dt) {
        frame += dt;
        shake = Math.max(0, shake - dt * 0.75);
        flash = Math.max(0, flash - dt * 0.06);

        if (state === "ready") {
          bird.y = 260 + Math.sin(frame * 0.08) * 8;
          bird.rotation = Math.sin(frame * 0.05) * 0.05;
          bird.wing = Math.max(0, bird.wing - dt * 0.08);
        }

        if (state === "playing") {
          speed = Math.min(5.25, speed + dt * 0.0019);
          bird.vy += 0.48 * dt;
          bird.y += bird.vy * dt;
          bird.rotation = lerp(bird.rotation, clamp(bird.vy / 12, -0.62, 0.86), 0.14 * dt);
          bird.wing = Math.max(0, bird.wing - dt * 0.095);

          spawnTimer -= dt;
          if (spawnTimer <= 0) {
            spawnObstacle();
            spawnTimer = 104 - Math.min(score, 16) * 1.2;
          }

          for (const obstacle of obstacles) {
            obstacle.x -= speed * dt;
            if (!obstacle.scored && obstacle.x + obstacle.w < bird.x - bird.radius * 0.35) {
              obstacle.scored = true;
              score += 1;
              if (score % 5 === 0) {
                for (let i = 0; i < 12; i += 1) {
                  particles.push({
                    x: bird.x + 18,
                    y: bird.y - 20,
                    vx: -1 + Math.random() * 2,
                    vy: -2.5 - Math.random() * 2.5,
                    g: 0.09,
                    life: 34 + Math.random() * 12,
                    maxLife: 46,
                    size: 5 + Math.random() * 7,
                    spin: (Math.random() - 0.5) * 0.24,
                    angle: Math.random() * Math.PI * 2
                  });
                }
              }
            }
          }

          while (obstacles.length && obstacles[0].x + obstacles[0].w < -60) {
            obstacles.shift();
          }

          if (bird.y - bird.radius * 0.86 < 0 || bird.y + bird.radius * 0.82 > groundY) {
            gameOver();
          }

          for (const obstacle of obstacles) {
            if (circleHitsObstacle(obstacle)) {
              gameOver();
              break;
            }
          }
        } else if (state === "gameover") {
          bird.vy += 0.34 * dt;
          bird.y = Math.min(groundY - bird.radius * 0.72, bird.y + bird.vy * dt);
          bird.rotation = lerp(bird.rotation, 1.12, 0.08 * dt);
        }

        for (const p of particles) {
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += p.g * dt;
          p.angle += p.spin * dt;
          p.life -= dt;
        }

        for (let i = particles.length - 1; i >= 0; i -= 1) {
          if (particles[i].life <= 0 || particles[i].y > H + 20) {
            particles.splice(i, 1);
          }
        }
      }

      function circleHitsObstacle(obstacle) {
        const rX = bird.radius * 0.72;
        const rY = bird.radius * 0.76;
        const birdLeft = bird.x - rX;
        const birdRight = bird.x + rX;
        const birdTop = bird.y - rY;
        const birdBottom = bird.y + rY;

        if (birdRight < obstacle.x || birdLeft > obstacle.x + obstacle.w) {
          return false;
        }

        const hitTop = birdTop < obstacle.top + 4;
        const hitBottom = birdBottom > obstacle.bottom - 4;
        return hitTop || hitBottom;
      }

      function drawHerbObstacle(obstacle) {
        drawHerbColumn(obstacle.x, -42, obstacle.w, obstacle.top + 52, true, obstacle.seed);
        drawHerbColumn(obstacle.x, obstacle.bottom - 10, obstacle.w, groundY - obstacle.bottom + 40, false, obstacle.seed + 4.5);

        ctx.save();
        ctx.globalAlpha = 0.2;
        ctx.strokeStyle = "#ecffd8";
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 12]);
        ctx.beginPath();
        ctx.moveTo(obstacle.x + obstacle.w / 2, obstacle.top + 20);
        ctx.lineTo(obstacle.x + obstacle.w / 2, obstacle.bottom - 20);
        ctx.stroke();
        ctx.restore();
      }

      function drawHerbColumn(x, y, w, h, inverted, seed) {
        ctx.save();

        const stemGrad = ctx.createLinearGradient(x, y, x + w, y);
        stemGrad.addColorStop(0, "#0b4d22");
        stemGrad.addColorStop(0.25, "#167435");
        stemGrad.addColorStop(0.52, "#48bd50");
        stemGrad.addColorStop(0.78, "#1b7a35");
        stemGrad.addColorStop(1, "#082d17");

        ctx.shadowColor = "rgba(0, 0, 0, 0.26)";
        ctx.shadowBlur = 12;
        ctx.shadowOffsetY = 7;
        roundRectPath(ctx, x + 8, y, w - 16, h, 22);
        ctx.fillStyle = stemGrad;
        ctx.fill();

        ctx.shadowColor = "transparent";
        ctx.globalAlpha = 0.25;
        ctx.strokeStyle = "#f2ffd0";
        ctx.lineWidth = 2;
        for (let i = 0; i < 4; i += 1) {
          const lx = x + 22 + i * 14 + Math.sin(seed + i) * 3;
          ctx.beginPath();
          ctx.moveTo(lx, y + 16);
          ctx.bezierCurveTo(lx + 12, y + h * 0.35, lx - 15, y + h * 0.72, lx + 4, y + h - 16);
          ctx.stroke();
        }

        ctx.globalAlpha = 1;
        const capY = inverted ? y + h - 7 : y + 7;
        const capGrad = ctx.createLinearGradient(x, capY - 28, x, capY + 28);
        capGrad.addColorStop(0, "#8fea60");
        capGrad.addColorStop(0.52, "#36b246");
        capGrad.addColorStop(1, "#12662d");

        ctx.fillStyle = capGrad;
        roundRectPath(ctx, x - 8, capY - 24, w + 16, 48, 24);
        ctx.fill();
        ctx.strokeStyle = "rgba(238, 255, 207, 0.32)";
        ctx.lineWidth = 3;
        ctx.stroke();

        for (let i = 0; i < 14; i += 1) {
          const side = i % 2 === 0 ? -1 : 1;
          const yy = inverted
            ? capY + 16 + Math.sin(i + seed) * 10
            : capY - 16 + Math.sin(i + seed) * 10;
          const xx = x + w / 2 + side * (24 + Math.sin(i * 1.7 + seed) * 19);
          const angle = (inverted ? Math.PI : 0) + side * (0.8 + Math.sin(seed + i) * 0.3);
          drawLeaf(xx, yy, 13 + (i % 4) * 3, angle, i % 3 === 0 ? "#9bea65" : "#43be4d", 0.98, true);
        }

        for (let i = 0; i < 5; i += 1) {
          const yy = y + 30 + (h - 60) * (i / 5);
          const left = x + 12 + Math.sin(seed + i * 2) * 4;
          const right = x + w - 12 + Math.cos(seed + i * 2) * 4;
          drawLeaf(left, yy, 10 + i, -0.95 + Math.sin(seed + i) * 0.25, "#3dbb48", 0.88, true);
          drawLeaf(right, yy + 18, 11 + i, 0.95 + Math.cos(seed + i) * 0.25, "#5bd257", 0.88, true);
        }

        ctx.restore();
      }

      function drawParticles() {
        for (const p of particles) {
          const alpha = clamp(p.life / p.maxLife, 0, 1);
          drawLeaf(p.x, p.y, p.size, p.angle, p.size > 10 ? "#9eee68" : "#5ed357", alpha * 0.86, false);
        }
      }

      function drawBird() {
        ctx.save();
        ctx.translate(bird.x, bird.y);
        ctx.rotate(bird.rotation);

        ctx.save();
        ctx.translate(-18, 9);
        ctx.rotate(-0.7 - bird.wing * 0.92);
        drawLeaf(0, 0, 28 + bird.wing * 4, Math.PI / 2, "#7fea64", 0.95, true);
        ctx.restore();

        ctx.shadowColor = "rgba(0, 0, 0, 0.34)";
        ctx.shadowBlur = 16;
        ctx.shadowOffsetY = 7;
        ctx.beginPath();
        ctx.arc(0, 0, bird.radius + 5, 0, Math.PI * 2);
        ctx.fillStyle = "#163d1c";
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;

        ctx.save();
        ctx.beginPath();
        ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
        ctx.clip();

        if (chiconha.complete && chiconha.naturalWidth > 0) {
          const sourceSize = Math.min(chiconha.naturalWidth, chiconha.naturalHeight);
          const sx = Math.max(0, (chiconha.naturalWidth - sourceSize) / 2);
          const sy = clamp(44, 0, Math.max(0, chiconha.naturalHeight - sourceSize));
          ctx.drawImage(chiconha, sx, sy, sourceSize, sourceSize, -bird.radius, -bird.radius, bird.radius * 2, bird.radius * 2);
        } else {
          ctx.fillStyle = "#f3d3b4";
          ctx.fillRect(-bird.radius, -bird.radius, bird.radius * 2, bird.radius * 2);
          ctx.fillStyle = "#1a120f";
          ctx.beginPath();
          ctx.arc(-11, -4, 4, 0, Math.PI * 2);
          ctx.arc(12, -4, 4, 0, Math.PI * 2);
          ctx.fill();
        }

        const shine = ctx.createRadialGradient(-12, -16, 0, -12, -16, 54);
        shine.addColorStop(0, "rgba(255, 255, 255, 0.32)");
        shine.addColorStop(0.45, "rgba(255, 255, 255, 0.08)");
        shine.addColorStop(1, "rgba(255, 255, 255, 0)");
        ctx.fillStyle = shine;
        ctx.fillRect(-bird.radius, -bird.radius, bird.radius * 2, bird.radius * 2);
        ctx.restore();

        ctx.lineWidth = 5;
        ctx.strokeStyle = "#a5ff72";
        ctx.beginPath();
        ctx.arc(0, 0, bird.radius + 1, 0, Math.PI * 2);
        ctx.stroke();

        ctx.lineWidth = 2;
        ctx.strokeStyle = "rgba(255, 255, 255, 0.52)";
        ctx.beginPath();
        ctx.arc(-2, -2, bird.radius - 3, Math.PI * 1.1, Math.PI * 1.72);
        ctx.stroke();

        ctx.save();
        ctx.translate(31, 6);
        ctx.rotate(0.22);
        ctx.fillStyle = "#ffdc54";
        ctx.strokeStyle = "rgba(63, 39, 0, 0.4)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -8);
        ctx.lineTo(23, 0);
        ctx.lineTo(0, 8);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        ctx.restore();
      }

      function drawHUD() {
        ctx.save();
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.font = "900 66px Inter, system-ui, sans-serif";
        ctx.lineWidth = 8;
        ctx.strokeStyle = "rgba(5, 24, 9, 0.72)";
        ctx.strokeText(String(score), W / 2, 69);
        ctx.fillStyle = "#f0ffd4";
        ctx.fillText(String(score), W / 2, 69);

        ctx.font = "800 17px Inter, system-ui, sans-serif";
        ctx.fillStyle = "rgba(239, 255, 219, 0.84)";
        ctx.fillText(`recorde: ${best}`, W / 2, 116);
        ctx.restore();
      }

      function drawCenteredPanel(title, subtitle, extraLines = []) {
        ctx.save();
        const boxW = 570;
        const boxH = 255 + extraLines.length * 28;
        const x = W / 2 - boxW / 2;
        const y = H / 2 - boxH / 2;

        ctx.fillStyle = "rgba(4, 20, 9, 0.72)";
        roundRectPath(ctx, x, y, boxW, boxH, 30);
        ctx.fill();

        ctx.strokeStyle = "rgba(210, 255, 179, 0.24)";
        ctx.lineWidth = 2;
        ctx.stroke();

        for (let i = 0; i < 8; i += 1) {
          drawLeaf(x + 35 + i * 70, y - 1 + Math.sin(i) * 4, 13 + (i % 3) * 2, -0.8 + i * 0.22, "#75df54", 0.92, true);
        }

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "1000 53px Inter, system-ui, sans-serif";
        ctx.lineWidth = 7;
        ctx.strokeStyle = "rgba(2, 16, 7, 0.9)";
        ctx.strokeText(title, W / 2, y + 70);
        ctx.fillStyle = "#efffd2";
        ctx.fillText(title, W / 2, y + 70);

        ctx.font = "800 22px Inter, system-ui, sans-serif";
        ctx.fillStyle = "#bafc98";
        ctx.fillText(subtitle, W / 2, y + 126);

        ctx.font = "650 18px Inter, system-ui, sans-serif";
        ctx.fillStyle = "rgba(240, 255, 229, 0.82)";
        ctx.fillText("Barra de espaço: bater asas", W / 2, y + 169);
        ctx.fillText("Desvie das colunas de ervas e faça pontos.", W / 2, y + 198);

        ctx.font = "750 17px Inter, system-ui, sans-serif";
        ctx.fillStyle = "rgba(228, 255, 202, 0.86)";
        extraLines.forEach((line, index) => {
          ctx.fillText(line, W / 2, y + 232 + index * 28);
        });

        ctx.restore();
      }

      function drawReadyScreen() {
        drawCenteredPanel("Flappy Chiconha", "a revoada das ervas", [`Recorde atual: ${best}`]);
      }

      function drawGameOverScreen() {
        const isNewRecord = lastRecord;
        drawCenteredPanel(
          "Fim de jogo",
          isNewRecord ? "novo recorde nas ervas!" : "a erva venceu dessa vez",
          [`Pontuação: ${score}`, `Recorde: ${best}`, "Espaço para tentar de novo"]
        );
      }

      function drawVignette() {
        const vignette = ctx.createRadialGradient(W / 2, H / 2, 120, W / 2, H / 2, 620);
        vignette.addColorStop(0, "rgba(0, 0, 0, 0)");
        vignette.addColorStop(0.72, "rgba(0, 0, 0, 0.06)");
        vignette.addColorStop(1, "rgba(0, 0, 0, 0.32)");
        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, W, H);
      }

      function draw() {
        ctx.save();

        if (shake > 0) {
          ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
        }

        drawBackground();

        for (const obstacle of obstacles) {
          drawHerbObstacle(obstacle);
        }

        drawParticles();
        drawGround();
        drawBird();
        drawHUD();
        drawVignette();

        if (state === "ready") {
          drawReadyScreen();
        } else if (state === "gameover") {
          drawGameOverScreen();
        }

        if (flash > 0) {
          ctx.globalAlpha = flash * 0.18;
          ctx.fillStyle = "#f9ffd9";
          ctx.fillRect(0, 0, W, H);
        }

        ctx.restore();
      }

      function tick(time) {
        const dt = lastTime ? clamp((time - lastTime) / 16.6667, 0.1, 2.2) : 1;
        lastTime = time;
        update(dt);
        draw();
        requestAnimationFrame(tick);
      }

      window.addEventListener("keydown", (event) => {
        if (event.code === "Space") {
          event.preventDefault();
          startOrFlap();
        } else if (event.code === "KeyR") {
          event.preventDefault();
          resetRound();
        }
      }, { passive: false });

      canvas.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        startOrFlap();
      });

      canvas.addEventListener("contextmenu", (event) => event.preventDefault());

      window.addEventListener("blur", () => {
        if (state === "playing") {
          state = "ready";
          bird.vy = 0;
        }
      });

      resetRound();
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
